name: Evaluation Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Live eval regression gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_ADMIN_KEY: ${{ secrets.AZURE_SEARCH_ADMIN_KEY }}
      AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify live eval secrets
        run: |
          missing=()
          for secret_name in \
            AZURE_SEARCH_ENDPOINT \
            AZURE_SEARCH_ADMIN_KEY \
            AZURE_SEARCH_INDEX_NAME \
            AZURE_OPENAI_ENDPOINT \
            AZURE_OPENAI_API_KEY \
            AZURE_OPENAI_CHAT_DEPLOYMENT \
            AZURE_OPENAI_EMBEDDING_DEPLOYMENT
          do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Run fast tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Fetch base branch baseline
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:evaluation/eval_baseline.json" \
            > evaluation/eval_baseline.base.json

      - name: Use current baseline for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cp evaluation/eval_baseline.json evaluation/eval_baseline.base.json

      - name: Run live evaluation
        run: |
          python -m evaluation.eval_runner \
            --results-file evaluation/eval_results.ci.json

      - name: Compare against regression baseline
        run: |
          python -m evaluation.compare_eval_baseline \
            --results-file evaluation/eval_results.ci.json \
            --baseline-file evaluation/eval_baseline.base.json \
            --proposed-baseline-file evaluation/eval_baseline.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evaluation/eval_results.ci.json
            evaluation/eval_baseline.base.json
          if-no-files-found: ignore

  fork-pr-note:
    name: Live eval unavailable for fork PRs
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Explain skipped live eval
        run: |
          echo "Live eval uses Azure secrets and is skipped for fork pull requests."
          echo "Run workflow_dispatch from a trusted branch when live eval is needed."
